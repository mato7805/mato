<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thumbnail Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #050505; color: #e0e0e0; font-family: sans-serif; display: flex; flex-direction: column; min-height: 100vh; margin: 0; }
    .masonry-grid { column-count: 2; column-gap: 1.5rem; margin-top: 1.5rem; }
    @media (min-width: 640px) { .masonry-grid { column-count: 3; } }
    @media (min-width: 768px) { .masonry-grid { column-count: 4; } }
    @media (min-width: 1024px) { .masonry-grid { column-count: 5; } }
    .masonry-item { break-inside: avoid; margin-bottom: 1.5rem; display: flex; flex-direction: column; border-radius: 0.75rem; overflow: hidden; background-color: #111; border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s; text-decoration: none; }
    .masonry-item:hover { border-color: rgba(212,175,55,0.5); box-shadow: 0 0 20px rgba(212,175,55,0.15); }
    .masonry-item-link { cursor: pointer; display: block; flex-grow: 1; text-decoration: none; }
    .img-wrapper { background: linear-gradient(to bottom, #222, #111); display: flex; justify-content: center; align-items: center; padding: 0.5rem; border-radius: 0.25rem; }
    .img-wrapper img { width: 100%; height: auto; border-radius: 0.25rem; transition: transform 0.5s; object-fit: contain; }
    .masonry-item:hover .img-wrapper img { transform: scale(1.05); }
    .title-banner { padding: 1rem; background-color: rgba(0,0,0,0.4); backdrop-filter: blur(4px); border-top: 1px solid rgba(255,255,255,0.05); }
    .title-banner p { margin: 0; font-size: 0.75rem; color: white; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .shortcut-btn-container { padding: 0 1rem 1rem 1rem; background-color: rgba(0,0,0,0.4); backdrop-filter: blur(4px); margin-top: auto; }
    .shortcut-btn { width: 100%; padding: 0.5rem; background-color: rgba(212,175,55,0.2); color: #D4AF37; border: none; border-radius: 0.25rem; cursor: pointer; font-size: 0.75rem; font-weight: bold; transition: all 0.2s; }
    .shortcut-btn:hover { background-color: #D4AF37; color: black; }
    .auth-container { position: fixed; inset: 0; background-color: #050505; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; font-family: sans-serif; padding: 1rem; }
    .auth-card { background-color: #0a0a0a; padding: 2rem; border-radius: 1rem; border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 28rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); position: relative; }
    .auth-input { width: 100%; height: 3rem; background-color: #111; border: 1px solid rgba(255,255,255,0.1); border-radius: 0.75rem; padding: 0.75rem 1rem; color: white; text-align: center; font-size: 1.125rem; margin-bottom: 1.5rem; box-sizing: border-box; outline: none; transition: border-color 0.2s;}
    .auth-input:focus { border-color: rgba(212,175,55,0.5); }
    .auth-btn { width: 100%; height: 3rem; background-color: #D4AF37; color: black; font-weight: 600; font-size: 1rem; border: none; border-radius: 0.75rem; cursor: pointer; transition: background-color 0.2s; box-shadow: 0 10px 15px -3px rgba(212,175,55,0.1); }
    .auth-btn:hover { background-color: #b8962f; }
    .admin-btn-icon { position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: rgba(255,255,255,0.5); cursor: pointer; border-radius: 0.5rem; padding: 0.5rem;}
    .admin-btn-icon:hover { color: white; }
    .modal-overlay { position: absolute; inset: 0; background-color: #0a0a0a; z-index: 10; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; border-radius: 1rem; }
  </style>
</head>
<body>
  <div id="authScreen" class="auth-container">
    <div class="auth-card">
      <button type="button" id="openAdminAuthBtn" class="admin-btn-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
      
      <form id="appLoginForm" style="width: 100%; display: flex; flex-direction: column; justify-content: center; margin-top: 2rem;">
        <input type="password" id="appPasswordInput" placeholder="비밀번호" class="auth-input" autofocus />
        <p id="appLoginError" style="color: #f87171; text-align: center; margin-top: 0; margin-bottom: 1rem; font-size: 0.875rem; display: none;"></p>
        <button type="submit" class="auth-btn">접속</button>
      </form>
      
      <div id="adminAuthModal" class="modal-overlay">
        <button type="button" id="closeAdminAuthBtn" class="admin-btn-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <h3 style="margin-top:0; margin-bottom: 1.5rem; font-size: 1.25rem; font-weight: 300; text-align: center; width: 100%;">관리자 인증</h3>
        <form id="adminAuthForm" style="width: 100%;">
          <input type="password" id="adminPasswordInput" placeholder="관리자 비밀번호" class="auth-input" />
          <p id="adminAuthError" style="color: #f87171; text-align: center; margin-top: 0; margin-bottom: 1rem; font-size: 0.875rem; display: none;"></p>
          <button type="submit" class="auth-btn" style="background-color: rgba(255,255,255,0.1); color: white; box-shadow: none;">확인</button>
        </form>
      </div>

      <div id="changePasswordModal" class="modal-overlay">
        <button type="button" id="closeChangePasswordBtn" class="admin-btn-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <h3 style="margin-top:0; margin-bottom: 0.5rem; font-size: 1.25rem; font-weight: 300; text-align: center; width: 100%;">앱 비밀번호 변경</h3>
        <p style="color: rgba(255,255,255,0.5); font-size: 0.875rem; text-align: center; margin-bottom: 1.5rem; margin-top:0; width: 100%;">새로운 비밀번호를 입력해주세요.</p>
        <form id="changePasswordForm" style="width: 100%;">
          <input type="text" id="newPasswordInput" placeholder="새 비밀번호" class="auth-input" />
          <button type="submit" class="auth-btn">저장</button>
        </form>
      </div>
    </div>
  </div>

  <div id="appMain" style="display: none; flex-direction: column; min-height: 100vh;">
  <header class="flex-none p-6 border-b border-white/10 bg-[#0a0a0a]">
    <div class="max-w-4xl mx-auto space-y-4">
      <form id="fetchForm" class="flex items-center gap-4 w-full">
        <div class="flex-1 relative">
          <input 
            type="url" 
            id="urlInput"
            value="https://www4.zimuquan28.uk/index.php/vod/show/id/1.html" 
            placeholder="Target Website URL..."
            class="w-full bg-white/5 border border-white/10 rounded-full py-3 px-6 text-sm text-[#D4AF37] focus:outline-none focus:border-[#D4AF37]/50 placeholder-white/20"
            required
          />
        </div>
        <button 
          type="submit"
          id="fetchBtn"
          class="px-8 py-3 bg-[#D4AF37] text-black font-semibold rounded-full text-sm hover:bg-[#b8962f] transition-colors flex-none"
        >
          Fetch Preview
        </button>
        <button 
          type="button"
          id="adminBtnHtml"
          class="px-4 py-3 bg-[#333] text-white font-semibold rounded-full text-sm hover:bg-[#444] transition-colors flex-none"
        >
          Admin
        </button>
      </form>
      
      <div class="flex flex-col md:flex-row items-center gap-4 w-full">
        <form id="searchForm" class="flex-1 flex items-center gap-4 w-full">
          <div class="flex-1 relative">
            <input 
              type="text" 
              id="searchInput"
              placeholder="Search keywords..."
              class="w-full bg-[#111] border border-white/10 rounded-full py-3 px-6 text-sm text-white focus:outline-none focus:border-[#D4AF37]/50 placeholder-white/20"
              required
            />
          </div>
          <button 
            type="submit"
            id="searchBtn"
            class="px-6 py-3 bg-white/10 text-white font-semibold rounded-full text-sm hover:bg-white/20 transition-colors flex-none"
          >
            Search
          </button>
        </form>
        <form id="domainForm" class="flex-1 hidden items-center gap-4 w-full">
          <div class="flex-1 relative">
            <input 
              type="url" 
              id="domainInput"
              value="https://www4.zimuquan28.uk"
              placeholder="https://..."
              class="w-full bg-[#111] border border-white/10 rounded-full py-3 px-6 text-sm text-white focus:outline-none focus:border-[#D4AF37]/50 placeholder-white/20"
              required
            />
          </div>
          <button 
            type="submit"
            class="px-6 py-3 bg-red-500/20 text-red-500 font-semibold rounded-full text-sm hover:bg-red-500/30 transition-colors flex-none"
          >
            Change Domain
          </button>
        </form>
      </div>
    </div>
  </header>

  <main class="flex-1 p-4 sm:p-8 overflow-y-auto">
    <div class="max-w-[1400px] mx-auto">
      <div id="errorMsg" class="text-red-400 text-sm mb-6 hidden"></div>
      
      <div class="mb-6 flex items-center justify-between" id="headerInfo" style="display:none;">
        <div>
          <h2 class="text-2xl font-light tracking-wide text-white">Media Library Preview</h2>
          <p class="text-xs uppercase tracking-widest text-white/40 mt-1" id="sourceHost"></p>
        </div>
        <div class="flex space-x-2 items-center" id="paginationTop" style="display:none;">
          <button type="button" id="prevPageBtnHtml" class="px-3 py-1 bg-[#D4AF37]/10 text-[#D4AF37] rounded text-[10px] border border-[#D4AF37]/20 hover:bg-[#D4AF37]/20 font-bold">&larr; PREV</button>
          <button type="button" id="nextPageBtnHtml" class="px-3 py-1 bg-[#D4AF37]/10 text-[#D4AF37] rounded text-[10px] border border-[#D4AF37]/20 hover:bg-[#D4AF37]/20 font-bold">NEXT &rarr;</button>
        </div>
      </div>

      <div id="gridContainer" class="masonry-grid"></div>
      
      <div class="mt-8 flex justify-center pb-8 border-t border-white/5 pt-8" id="footerNextPage" style="display:none;">
        <div class="flex flex-col sm:flex-row items-center gap-4">
          <div class="flex flex-wrap items-center justify-center gap-2" id="paginationNumbersList">
          </div>
          
          <form id="jumpPageFormHtml" class="flex items-center space-x-2 sm:ml-4 mt-4 sm:mt-0">
            <input type="number" id="jumpPageInputHtml" placeholder="Page" class="w-20 bg-[#111] border border-white/10 rounded-lg py-2 px-3 text-sm text-white focus:outline-none focus:border-[#D4AF37]/50 placeholder-white/20 text-center" min="1" >
            <button type="submit" class="px-4 py-2 bg-white/10 text-white font-semibold rounded-lg text-sm hover:bg-white/20 transition-colors">Go</button>
          </form>
        </div>
      </div>
    </div>
  </main>
  
  <script>
    const form = document.getElementById('fetchForm');
    const urlInput = document.getElementById('urlInput');
    const fetchBtn = document.getElementById('fetchBtn');
    const prevPageBtnHtml = document.getElementById('prevPageBtnHtml');
    const nextPageBtnHtml = document.getElementById('nextPageBtnHtml');
    const footerNextPage = document.getElementById('footerNextPage');
    const paginationTop = document.getElementById('paginationTop');
    const gridContainer = document.getElementById('gridContainer');
    const errorMsg = document.getElementById('errorMsg');
    const headerInfo = document.getElementById('headerInfo');
    const sourceHost = document.getElementById('sourceHost');
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const domainForm = document.getElementById('domainForm');
    const domainInput = document.getElementById('domainInput');
    const adminBtnHtml = document.getElementById('adminBtnHtml');

    if (adminBtnHtml && domainForm) {
      adminBtnHtml.addEventListener('click', () => {
        if (domainForm.classList.contains('hidden')) {
          domainForm.classList.remove('hidden');
          domainForm.classList.add('flex');
        } else {
          domainForm.classList.add('hidden');
          domainForm.classList.remove('flex');
        }
      });
    }

    domainForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const newDomain = domainInput.value.trim().replace(/\/$/, '');
      if (window.confirm('Are you sure you want to change the domain to ' + newDomain + '?')) {
        localStorage.setItem('zimuquan_base_domain', newDomain);
        const newUrl = newDomain + '/index.php/vod/show/id/1.html';
        urlInput.value = newUrl;
        executeFetchHtml(newUrl);
      }
    });

    searchForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const keyword = searchInput.value;
      if (!keyword) return;
      try {
        const urlObj = new URL(urlInput.value);
        const searchUrl = urlObj.origin + '/index.php/vod/search/wd/' + encodeURIComponent(keyword.trim()) + '.html';
        urlInput.value = searchUrl;
        executeFetchHtml(searchUrl);
        searchInput.value = '';
      } catch (err) {
        alert("Enter a valid Base URL first before searching.");
      }
    });

    window.addEventListener('popstate', (e) => {
      if (e.state && e.state.url) {
        urlInput.value = e.state.url;
        executeFetchHtml(e.state.url);
      }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const url = urlInput.value;
      if (!url) return;
      try {
        if (!history.state || history.state.url !== url) {
          window.history.pushState({ url: url }, "", "");
        }
      } catch(err) {}
      executeFetchHtml(url);
    });

    async function executeFetchHtml(url) {
      if (!url) return;

      fetchBtn.disabled = true;
      fetchBtn.textContent = "Loading...";
      gridContainer.innerHTML = '<div class="col-span-full py-20 flex flex-col items-center justify-center text-[#D4AF37]"><svg class="animate-spin h-8 w-8 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><p class="font-bold border border-[#D4AF37] rounded-full px-6 py-2">Scraping site... <span id="loadingProgressHtml">0%</span></p></div>';
      errorMsg.classList.add('hidden');
      headerInfo.style.display = 'none';
      paginationTop.style.display = 'none';
      footerNextPage.style.display = 'none';

      let progress = 0;
      const progressInterval = setInterval(() => {
        progress = progress < 90 ? progress + Math.floor(Math.random() * 15) + 5 : progress;
        const pEl = document.getElementById('loadingProgressHtml');
        if (pEl) pEl.innerText = progress + '%';
      }, 300);

      try {
        let html = null;
        let lastError = null;
        const encodedUrl = encodeURIComponent(url);

        const proxies = [
          'https://corsproxy.io/?' + encodedUrl,
          'https://api.allorigins.win/get?url=' + encodedUrl,
          'https://api.codetabs.com/v1/proxy?quest=' + encodedUrl
        ];

        for (const proxyUrl of proxies) {
          try {
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error("HTTP " + response.status);
            
            if (proxyUrl.includes('allorigins')) {
              const data = await response.json();
              if (data.contents) {
                html = data.contents;
                break;
              }
            } else {
              html = await response.text();
              if (html) break;
            }
          } catch(err) {
            lastError = err;
          }
        }

        if (!html) {
          throw new Error("Failed to fetch via proxies: " + (lastError ? lastError.message : "Unknown"));
        }
        
        // Remove nested escapes by matching normally
        const obfuscationMatch = html.match(/decodeURIComponent\(\s*atob\(\s*(["'])(.*?)\1\s*\)\s*\)/);
        if (obfuscationMatch && obfuscationMatch[2]) {
          try { html = decodeURIComponent(atob(obfuscationMatch[3] || obfuscationMatch[2])); } catch (err) {}
        }

        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const origin = new URL(url).origin;
        const scrapedItems = [];
        let totalPagesHtml = 1;

        const links = doc.querySelectorAll('a');
        links.forEach((a) => {
          let href = a.getAttribute('href');
          if (href) {
            const vpageMatch = href.match(/\/page\/(\d+)/);
            if (vpageMatch) {
              const parsedPage = parseInt(vpageMatch[1], 10);
              if (!isNaN(parsedPage) && parsedPage > totalPagesHtml) {
                totalPagesHtml = parsedPage;
              }
            }
          }
          const img = a.querySelector('img');
          if (img) {
            let href = a.getAttribute('href');
            let src = img.getAttribute('data-original') || img.getAttribute('data-src') || img.getAttribute('data-lazy-src') || img.getAttribute('src');
            
            let titleNode = a.querySelector('.subtitle, .title, .name, .text-overflow');
            if (!titleNode && a.parentElement) {
              titleNode = a.parentElement.querySelector('.subtitle, .title, .name, .text-overflow');
            }
            if (!titleNode) {
              const closestBox = a.closest('li, .card, .vodlist_item');
              if (closestBox) titleNode = closestBox.querySelector('.subtitle, .title, .name, .text-overflow');
            }
            let title = titleNode ? titleNode.textContent.trim() : '';
            if (!title) title = img.getAttribute('alt') || img.getAttribute('title') || a.getAttribute('title') || a.textContent.trim();
            if (!title || title.length > 100) title = 'Thumbnail';

            if (href && src && !href.startsWith('javascript:')) {
              if (!href.startsWith('http')) href = href.startsWith('/') ? origin + href : origin + '/' + href;
              if (!src.startsWith('http')) src = src.startsWith('/') ? origin + src : origin + '/' + src;

              if (!src.includes('pixel') && !src.includes('blank')) {
                if (!scrapedItems.find(i => i.src === src)) {
                  scrapedItems.push({ href: href, src: src, title: title });
                }
              }
            }
          }
        });

        const thumbs = doc.querySelectorAll('.stui-vodlist__thumb, .mac_vodlist__thumb, .lazyload');
        thumbs.forEach((el) => {
          let href = el.getAttribute('href') || (el.parentElement && el.parentElement.tagName === 'A' ? el.parentElement.getAttribute('href') : null);
          let src = el.getAttribute('data-original') || el.getAttribute('data-src');
          if (!src) {
            const style = el.getAttribute('style');
            if (style && style.includes('background-image')) {
              const m = style.match(/background-image:\s*url\(['"]?(.*?)['"]?\)/);
              if (m) src = m[1];
            }
          }
          
          let cardNode = el.closest('.card, .vodlist_item, li, div[class*="item"], div[class*="box"]');
          let titleNode = cardNode ? cardNode.querySelector('.subtitle, .title, .name, .text-overflow') : null;
          let title = titleNode ? titleNode.textContent.trim() : '';
          if (!title) title = el.getAttribute('title') || el.getAttribute('alt') || el.textContent.trim();
          if (!title || title.length > 100) title = 'Thumbnail';
          
          if (src && src.includes('url(')) {
            src = src.replace(/^url\(['"]?/, '').replace(/['"]?\)$/, '');
          }
          if (href && src && !href.startsWith('javascript:')) {
            if (!href.startsWith('http')) href = href.startsWith('/') ? origin + href : origin + '/' + href;
            if (!src.startsWith('http')) src = src.startsWith('/') ? origin + src : origin + '/' + src;
            if (!scrapedItems.find(i => i.src === src)) {
              scrapedItems.push({ href: href, src: src, title: title });
            }
          }
        });

        if (scrapedItems.length === 0) throw new Error("No thumbnails found on target page");
        window.currentTotalPages = totalPagesHtml;

        gridContainer.innerHTML = '';

        let host = 'VOD Distribution';
        try { host = new URL(url).hostname; } catch(e) {}
        sourceHost.textContent = "Source: " + host;
        headerInfo.style.display = 'flex';
        paginationTop.style.display = 'flex';
        footerNextPage.style.display = 'flex';

        const isFirst = !/\/page\/(\d+)/.test(url) || /\/page\/1\b/.test(url);
        if (isFirst) {
          prevPageBtnHtml.style.display = 'none';
        } else {
          prevPageBtnHtml.style.display = 'block';
        }
        
        const currentPageMatch = url.match(/\/page\/(\d+)/);
        const currentPage = currentPageMatch ? parseInt(currentPageMatch[1], 10) : 1;
        const isLastHtml = totalPagesHtml && currentPage >= totalPagesHtml;
        if (isLastHtml) {
          nextPageBtnHtml.style.display = 'none';
        } else {
          nextPageBtnHtml.style.display = 'block';
        }
        updateFooterPaginationHtml();

        scrapedItems.forEach(item => {
          const div = document.createElement('div');
          div.className = "masonry-item";

          const a = document.createElement('a');
          a.href = item.href;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.className = "masonry-item-link";
          a.onclick = function(e) {
            e.preventDefault();
            window.open(item.href, '_blank', 'noopener,noreferrer');
          };
          
          let titleHtml = "";
          if (item.title && item.title !== "Thumbnail") {
            titleHtml = "<div class='title-banner'><p>" + item.title.replace(/</g, '&lt;') + "</p></div>";
          }

          a.innerHTML = "<div class='img-wrapper'><img src='" + item.src + "' alt='Thumbnail' loading='lazy'></div>" + titleHtml;
          
          const btnDiv = document.createElement('div');
          btnDiv.className = 'shortcut-btn-container';
          const btn = document.createElement('button');
          btn.className = 'shortcut-btn';
          btn.textContent = 'Fetch Preview';
          btn.onclick = function(e) {
             e.preventDefault();
             e.stopPropagation();
             const newUrl = window.location.href.split('?')[0] + '?url=' + encodeURIComponent(item.href);
             window.open(newUrl, '_blank');
          };
          btnDiv.appendChild(btn);

          div.appendChild(a);
          div.appendChild(btnDiv);
          gridContainer.appendChild(div);
        });

      } catch (err) {
        errorMsg.textContent = err.message || "Failed to load URLs";
        errorMsg.classList.remove('hidden');
        gridContainer.innerHTML = '';
      } finally {
        if (progressInterval) clearInterval(progressInterval);
        const pEl = document.getElementById('loadingProgressHtml');
        if (pEl) pEl.innerText = '100%';
        fetchBtn.disabled = false;
        fetchBtn.textContent = "Fetch Preview";
      }
    }

    const handleGoToPageHtml = (pageNum) => {
      if (pageNum < 1 || isNaN(pageNum)) return;
      let newUrl = urlInput.value;
      if (/\/page\/\d+/.test(newUrl)) {
        if (pageNum === 1) {
           newUrl = newUrl.replace(/\/(show|type|search)\/(id|wd)\/([^\/]+)\/page\/\d+\.html/, '/$1/$2/$3.html');
           if (newUrl === urlInput.value) {
              newUrl = newUrl.replace(/\/page\/\d+/, '');
           }
        } else {
           newUrl = newUrl.replace(/\/page\/\d+/, `/page/${pageNum}`);
        }
      } else {
        if (pageNum > 1) {
           newUrl = newUrl.replace(/\.html$/, `/page/${pageNum}.html`);
        }
      }
      urlInput.value = newUrl;
      executeFetchHtml(newUrl);
    };

    const handleNextHtml = () => {
      let nextUrl = urlInput.value;
      const pageMatch = nextUrl.match(/\/page\/(\d+)/);
      if (pageMatch) {
         handleGoToPageHtml(parseInt(pageMatch[1], 10) + 1);
      } else {
         handleGoToPageHtml(2);
      }
    };

    const handlePrevHtml = () => {
      let prevUrl = urlInput.value;
      const pageMatch = prevUrl.match(/\/page\/(\d+)/);
      if (pageMatch) {
        const currentPage = parseInt(pageMatch[1], 10);
        if (currentPage > 1) {
          handleGoToPageHtml(currentPage - 1);
        }
      }
    };

    nextPageBtnHtml.addEventListener('click', handleNextHtml);
    prevPageBtnHtml.addEventListener('click', handlePrevHtml);

    const jumpPageFormHtml = document.getElementById('jumpPageFormHtml');
    const jumpPageInputHtml = document.getElementById('jumpPageInputHtml');
    jumpPageFormHtml.addEventListener('submit', (e) => {
        e.preventDefault();
        const pageNum = parseInt(jumpPageInputHtml.value, 10);
        if (!isNaN(pageNum) && pageNum > 0) handleGoToPageHtml(pageNum);
    });

    const updateFooterPaginationHtml = () => {
        const list = document.getElementById('paginationNumbersList');
        if(!list) return;
        list.innerHTML = '';
        const pageMatch = urlInput.value.match(/\/page\/(\d+)/);
        const currentPage = pageMatch ? parseInt(pageMatch[1], 10) : 1;

        if (currentPage > 1) {
            const btnPrev = document.createElement('button');
            btnPrev.className = "px-4 py-2 bg-[#D4AF37]/10 text-[#D4AF37] rounded-lg text-sm font-bold border border-[#D4AF37]/30 hover:bg-[#D4AF37]/20 transition-colors flex items-center";
            btnPrev.innerHTML = "&larr;";
            btnPrev.onclick = () => handleGoToPageHtml(currentPage - 1);
            list.appendChild(btnPrev);
        }

        let start = Math.max(1, currentPage - 2);
        let end = start + 4;
        const maxPages = window.currentTotalPages || 1;
        if (end > maxPages) {
            end = Math.max(maxPages, 1);
            start = Math.max(1, end - 4);
        }

        for (let pageNum = start; pageNum <= end; pageNum++) {
            const btn = document.createElement('button');
            if (pageNum === currentPage) {
                btn.className = "px-4 py-2 rounded-lg text-sm font-bold border transition-colors bg-[#D4AF37] text-black border-[#D4AF37]";
            } else {
                btn.className = "px-4 py-2 rounded-lg text-sm font-bold border transition-colors bg-[#D4AF37]/10 text-[#D4AF37] border-[#D4AF37]/30 hover:bg-[#D4AF37]/20";
            }
            btn.innerText = pageNum;
            btn.onclick = () => handleGoToPageHtml(pageNum);
            list.appendChild(btn);
        }

        if (maxPages > 1 && currentPage + 2 < maxPages) {
            const dots = document.createElement('span');
            dots.className = "text-white/50 px-1 font-bold";
            dots.innerText = "...";
            list.appendChild(dots);
            
            const btnLast = document.createElement('button');
            btnLast.className = "px-4 py-2 bg-[#D4AF37]/10 text-[#D4AF37] rounded-lg text-sm font-bold border border-[#D4AF37]/30 hover:bg-[#D4AF37]/20 transition-colors";
            btnLast.innerText = maxPages;
            btnLast.onclick = () => handleGoToPageHtml(maxPages);
            list.appendChild(btnLast);
        }

        if (currentPage < maxPages) {
            const btnNext = document.createElement('button');
            btnNext.className = "px-4 py-2 bg-[#D4AF37]/10 text-[#D4AF37] rounded-lg text-sm font-bold border border-[#D4AF37]/30 hover:bg-[#D4AF37]/20 transition-colors flex items-center";
            btnNext.innerHTML = "&rarr;";
            btnNext.onclick = () => handleGoToPageHtml(currentPage + 1);
            list.appendChild(btnNext);
        }
    };

    // Auto trigger on load is now handled after authentication
    const urlParams = new URLSearchParams(window.location.search);
    const urlParam = urlParams.get('url');
    let initialDomain = localStorage.getItem('zimuquan_base_domain') || 'https://www4.zimuquan28.uk';
    if (domainInput) domainInput.value = initialDomain;

    if (urlParam) {
        urlInput.value = urlParam;
    } else {
        urlInput.value = initialDomain + '/index.php/vod/show/id/1.html';
    }
    try {
      window.history.replaceState({ url: urlInput.value }, "", "");
    } catch(err) {}

    const MAIN_APP_ID = 'appMain';
    const AUTH_SCREEN_ID = 'authScreen';
    const ADMIN_AUTH_MODAL_ID = 'adminAuthModal';
    const CHANGE_PWD_MODAL_ID = 'changePasswordModal';
    
    function getCurrentAppPassword() {
      return localStorage.getItem('zimuquan_app_password') || '1024';
    }

    const appMainEl = document.getElementById(MAIN_APP_ID);
    const authScreenEl = document.getElementById(AUTH_SCREEN_ID);
    
    const appLoginFormEl = document.getElementById('appLoginForm');
    const appPasswordInputEl = document.getElementById('appPasswordInput');
    const appLoginErrorEl = document.getElementById('appLoginError');
    
    const adminAuthModalEl = document.getElementById(ADMIN_AUTH_MODAL_ID);
    const adminAuthFormEl = document.getElementById('adminAuthForm');
    const adminPasswordInputEl = document.getElementById('adminPasswordInput');
    const adminAuthErrorEl = document.getElementById('adminAuthError');
    const openAdminAuthBtnEl = document.getElementById('openAdminAuthBtn');
    const closeAdminAuthBtnEl = document.getElementById('closeAdminAuthBtn');
    
    const changePasswordModalEl = document.getElementById(CHANGE_PWD_MODAL_ID);
    const changePasswordFormEl = document.getElementById('changePasswordForm');
    const newPasswordInputEl = document.getElementById('newPasswordInput');
    const closeChangePasswordBtnEl = document.getElementById('closeChangePasswordBtn');

    if (sessionStorage.getItem('zimuquan_is_authenticated') === 'true') {
      authScreenEl.style.display = 'none';
      appMainEl.style.display = 'flex';
      const url = urlInput.value;
      if (url) executeFetchHtml(url);
    }

    appLoginFormEl.addEventListener('submit', (e) => {
      e.preventDefault();
      if (appPasswordInputEl.value === getCurrentAppPassword()) {
        authScreenEl.style.display = 'none';
        appMainEl.style.display = 'flex';
        appLoginErrorEl.style.display = 'none';
        sessionStorage.setItem('zimuquan_is_authenticated', 'true');
        
        const url = urlInput.value;
        if (url) executeFetchHtml(url);
      } else {
        appLoginErrorEl.textContent = '비밀번호가 일치하지 않습니다.';
        appLoginErrorEl.style.display = 'block';
      }
    });

    openAdminAuthBtnEl.addEventListener('click', () => {
      adminAuthModalEl.style.display = 'flex';
      appLoginErrorEl.style.display = 'none';
    });
    
    closeAdminAuthBtnEl.addEventListener('click', () => {
      adminAuthModalEl.style.display = 'none';
      adminPasswordInputEl.value = '';
      adminAuthErrorEl.style.display = 'none';
    });

    adminAuthFormEl.addEventListener('submit', (e) => {
      e.preventDefault();
      if (adminPasswordInputEl.value.trim() === 'min7801') {
        adminAuthModalEl.style.display = 'none';
        changePasswordModalEl.style.display = 'flex';
        adminPasswordInputEl.value = '';
        adminAuthErrorEl.style.display = 'none';
      } else {
        adminAuthErrorEl.textContent = '관리자 비밀번호가 일치하지 않습니다.';
        adminAuthErrorEl.style.display = 'block';
      }
    });

    closeChangePasswordBtnEl.addEventListener('click', () => {
      changePasswordModalEl.style.display = 'none';
      newPasswordInputEl.value = '';
    });

    changePasswordFormEl.addEventListener('submit', (e) => {
      e.preventDefault();
      if (newPasswordInputEl.value.trim()) {
        localStorage.setItem('zimuquan_app_password', newPasswordInputEl.value.trim());
        changePasswordModalEl.style.display = 'none';
        newPasswordInputEl.value = '';
        alert('비밀번호가 성공적으로 변경되었습니다.');
      }
    });
  </script>
  </div>
</body>
</html>
